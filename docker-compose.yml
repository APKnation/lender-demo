version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: lender_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lender_db}
      POSTGRES_USER: ${POSTGRES_USER:-lender_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lender_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker-init.sql:/docker-entrypoint-initdb.d/docker-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lender_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lender_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lender_backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://lender_user:lender_password@db:5432/lender_db
      REDIS_URL: redis://redis:6379/1
      DJANGO_SETTINGS_MODULE: lender.settings
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    command: >
      bash -c "python manage.py migrate && python manage.py seed_data --clear && gunicorn --bind 0.0.0.0:8000 --workers 4 lender.wsgi:application"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lender_frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  pgdata:
  static_volume:
